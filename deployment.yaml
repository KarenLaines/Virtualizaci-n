apiVersion: v1
kind: Namespace
metadata:
  name: hw-05

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: hw-05

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: hw-05

spec:
  selector:
    app: nginx

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

  type: LoadBalancer