apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: argocd-kflp
spec:
  project: default

  source:
    repoURL: https://github.com/karenlaines/Virtualizaci-n.git
    targetRevision: assessment-06
    path: gitops-apps/app1

  destination:
    server: https://kubernetes.default.svc
    namespace: parcial-kflp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

