apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd-kflp

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

patches:
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: argocd-kflp
    target:
      kind: ClusterRoleBinding