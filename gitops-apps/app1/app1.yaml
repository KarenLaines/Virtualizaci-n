apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: parcial-kflp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: parcial-kflp
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80