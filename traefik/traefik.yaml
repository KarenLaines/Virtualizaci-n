# ==========================================
# Namespace de Traefik
# ==========================================
apiVersion: v1
kind: Namespace
metadata:
  name: traefik

---

# ==========================================
# Cuenta que utilizará Traefik
# ==========================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik

---

# ==========================================
# Permisos para que Traefik pueda observar
# Services, Pods, Endpoints e Ingress
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-role
rules:
- apiGroups:
    - ""
  resources:
    - services
    - secrets
    - nodes
  verbs:
    - get
    - list
    - watch

- apiGroups:
    - discovery.k8s.io
  resources:
    - endpointslices
  verbs:
    - get
    - list
    - watch

- apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update

---

# ==========================================
# Une los permisos anteriores con Traefik
# ==========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-role

rules:
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
---

# ==========================================
# Deployment de Traefik
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  replicas: 1

  selector:
    matchLabels:
      app: traefik

  template:
    metadata:
      labels:
        app: traefik

    spec:
      serviceAccountName: traefik

      containers:
        - name: traefik
          image: traefik:v3.5

          args:
            - --providers.kubernetesingress=true
            - --entrypoints.web.address=:80

          ports:
            - name: web
              containerPort: 80

---

# ==========================================
# Service LoadBalancer de Traefik
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik

spec:
  type: LoadBalancer

  selector:
    app: traefik

  ports:
    - name: web
      port: 8080
      targetPort: 80